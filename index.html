<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- link of fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <!-- link of icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
        integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <!-- link css -->
    <link rel="stylesheet" href="css/style.css">
    <title>Document</title>
</head>

<body>
    <header>
        <img id="logo" src="assets/images/logo2.webp" alt="logo">
        <nav>
            <i id="menu" class="fa-solid fa-bars"></i>
            <p id="nav">Atlas Solutions / Support</p>
        </nav>
    </header>
    <main>
        <section id="hero">
            <h1>Gestion des demandes</h1>
            <p>Suivez et gérez les incidents informatiques.</p>
        </section>
        <section id="formulair">
            <h2>Créer une demande</h2>
            <p>Décrivez votre problème informatique.</p>
            <form onsubmit="valider_form(event)"> 
                <div id="div_titre">
                    <label for="Titre">Titre du problème *</label>
                    <input type="text" name="titre" class="champs" id="Titre" placeholder="Connexion Wi-Fi instable" >
                </div>
                <div id="div_catégorie">
                    <label for="Catégorie">Catégorie *</label>
                    <select name="Catégorie" class="champs"  id="Catégorie">
                        <option value="">choir categorie</option>
                        <option value="Réseau">Réseau</option>
                        <option value="Matériel">Matériel</option>
                        <option value="Logiciel">Logiciel</option>
                    </select>
                </div>
                <div id="div_priorité">
                    <label for="Priorité">Priorité *</label>
                    <select name="Priorité" class="champs" id="Priorité">
                        <option value="">choir Priorité</option>
                        <option value="Basse">Basse</option>
                        <option value="Normale">Normale</option>
                        <option value="Haute">Haute</option>
                    </select>
                </div>
                <div id="div_description">
                    <label for="Description">Description *</label>
                    <textarea name="Description" class="champs" placeholder="Décrivez votre problème..." id="Description"  ></textarea>
                </div>
                <div id="div_button">
                    <input type="submit" value="＋  Ajouter la demande" class="btn" id="button">
                    <input type="submit" value="Annuler" class="btn" id="button_anuller">
                </div>
            </form>
        </section>
        <section id="les_demandes">
            <div id="header_demandes">

                <div id="les_demandes_head">
                    <h2>Liste des demandes</h2>
                    <p id="total_demandes"></p>
                </div>
                <div id="cartes_taible">
                    <button id="Cartes">Cartes</button>
                    <button id="tableau">Tableau</button>
                </div>
            </div>
            <div id="articles">


            </div>
            <div id="taible_container" >
                <table>
                    <thead id="tableau_thead">
                        <tr id="tableau_thead_tr">
 
                        </tr>
                    </thead>
                    <tbody id="table_body">

                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="js/script.js"></script>
</body>

</html>
